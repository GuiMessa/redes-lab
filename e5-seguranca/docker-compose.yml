# ENTREGA 5 — O pacote entrega o segredo
#
# Um cliente no segmento A, um servidor no segmento B, e o roteador no meio.
# O roteador é quem vê tudo o que passa — no café da esquina, esse roteador é
# o ponto de acesso Wi-Fi. É desse lugar que a captura é feita.

name: e5

services:
  cliente:
    image: redes-lab-base:1
    container_name: e5-cliente
    cap_add: [NET_ADMIN]
    command: ["sh","-c","ip route del default 2>/dev/null||true; ip route add 10.0.20.0/24 via 10.0.10.254; exec sleep infinity"]
    networks: {seg-a: {ipv4_address: 10.0.10.10}}

  srv:
    image: redes-lab-base:1
    container_name: e5-srv
    cap_add: [NET_ADMIN]
    volumes: [".:/lab"]
    command: ["sh","/lab/iniciar-servidor.sh"]
    networks: {seg-b: {ipv4_address: 10.0.20.20}}

  router:
    image: redes-lab-base:1
    container_name: e5-router
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls: ["net.ipv4.ip_forward=1"]
    command: ["sh","-c","ip route del default 2>/dev/null||true; sysctl -w net.ipv4.ip_forward=1 2>/dev/null||true; exec sleep infinity"]
    networks:
      seg-a: {ipv4_address: 10.0.10.254}
      seg-b: {ipv4_address: 10.0.20.254}

networks:
  seg-a: {driver: bridge, ipam: {config: [{subnet: 10.0.10.0/24}]}}
  seg-b: {driver: bridge, ipam: {config: [{subnet: 10.0.20.0/24}]}}
